name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: 读取版本号
        id: ver
        shell: pwsh
        run: |
          $raw = Get-Content -LiteralPath "src/逐字自动输入.py" -Raw -Encoding UTF8
          $v = ([regex]::Match($raw, 'APP_VERSION\s*=\s*"([^"]+)"')).Groups[1].Value
          if (-not $v) { throw "未能从源码读取 APP_VERSION" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "版本: $v"

      - name: 打包（单文件版 + 便携版）
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $common = @(
            "--noconfirm","--clean","--windowed",
            "--icon","assets/app.ico",
            "--add-data","assets/app.ico;.",
            "--version-file","assets/version_info.txt",
            "src/逐字自动输入.py"
          )
          python -m PyInstaller @common --onefile --name "逐字自动输入_v$v" --distpath dist --workpath build --specpath build
          python -m PyInstaller @common --onedir  --name "逐字自动输入_v${v}_便携版" --distpath dist --workpath build --specpath build
          Copy-Item -LiteralPath "src/逐字自动输入.py" -Destination "dist/逐字自动输入_源码_v$v.py" -Force
          Compress-Archive -Path "dist/逐字自动输入_v${v}_便携版" -DestinationPath "dist/逐字自动输入_v${v}_便携版.zip" -Force

      - name: 生成 SHA256
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath dist -File |
            Where-Object { $_.Name -ne "SHA256.txt" } |
            Sort-Object Name |
            ForEach-Object {
              $h = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$h  $($_.Name)"
            } | Set-Content -LiteralPath dist/SHA256.txt -Encoding UTF8
          Get-Content -LiteralPath dist/SHA256.txt

      - name: 上传构建产物（手动运行时可下载）
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/*

      - name: 创建 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/逐字自动输入_v*.exe
            dist/逐字自动输入_v*_便携版.zip
            dist/逐字自动输入_源码_v*.py
            dist/SHA256.txt
